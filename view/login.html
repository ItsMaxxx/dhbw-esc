<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Login - DHBW ESC</title>
    <link rel="stylesheet" href="/assets/css/grid.css" />
    <link rel="stylesheet" href="/assets/css/dhbw-escc.css" />
    <link rel="stylesheet" href="/assets/css/backgroundd.css" />
    <link rel="stylesheet" href="/assets/css/login.css" />
    <link rel="stylesheet" href="/assets/css/cookie.css" />
</head>
<body>
<div class="grid-container">
    <div class="header"></div>

    <div class="homepage login-page-wrapper">
        <div class="login-box">
            <h2>Welcome Back!</h2>

            <div class="role-selector">
                <input type="radio" id="role-viewer" name="role" value="viewer" checked>
                <label for="role-viewer">Zuschauer</label>

                <input type="radio" id="role-jury" name="role" value="jury">
                <label for="role-jury">National Jury</label>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" required placeholder="mail@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <p id="error-message" class="error-msg hidden"></p>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
    </div>

    <div class="footer"></div>
</div>

<script src="/js/header.js"></script>
<script src="/js/cookie.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/login.js"></script> <!-- Neue Frontend-JS Logik -->
</body>
</html>
