<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>DHBW ESC-Voting</title>

        <!-- Sorgt dafür, dass die Browser nichts cachen und immer das Aktuellste vom Server geladen wird-->
        <meta
            http-equiv="Cache-Control"
            content="no-cache, no-store, must-revalidate"
        />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />

        <link rel="stylesheet" href="/assets/css/grid.css" />
        <link rel="stylesheet" href="/assets/css/dhbw-escc.css" />
        <link rel="stylesheet" href="/assets/css/backgroundd.css" />
        <link rel="stylesheet" href="/assets/css/cookie.css" />
        <link rel="stylesheet" href="/assets/css/news.css" />
    </head>

    <body>
        <!--- Start Grid Container --->
        <div class="grid-container">
            <!--- Start Header --->
            <div class="header"></div>
            <!--- End Header --->

            <!--- Start Homepage --->
            <div class="homepage">
                <!--- Hero Banner --->
                <section class="hero">
                    <img
                        src="/assets/images/Eurovision_Cat_Contest_Banner.png"
                        alt="Eurovision Cat Contest Logo"
                        class="hero__img"
                    />
                    <div class="hero__overlay">
                        <h1 class="hero__headline">
                            <span class="hero__hl-white">Eurovision</span>
                            <span class="hero__hl-pink">Non-Stop</span>
                            <span class="hero__hl-line3">
                                <span class="hero__hl-pink">Hits</span>
                                <span class="hero__hl-white"> is back</span>
                            </span>
                        </h1>
                        <p class="hero__description">
                            All your favourite songs, streamed live and on
                            demand — the best Eurovision songs are back.
                        </p>
                        <a href="https://www.youtube.com/watch?v=2yJgwwDcgV8" class="hero__btn" target="_blank">Watch Fan-Favorites on YouTube</a>
                    </div>
                </section>

                <!--- News Section --->
                <section class="news-section" id="news-section">
                    <div class="news-section-header">
                        <div class="news-title-group">
                            <span class="news-label">Newsfeed</span>
                            <h2 class="news-heading">
                                <span class="news-latest">Latest</span> news
                            </h2>
                        </div>
                        <div class="news-scroll-btns">
                            <button class="news-scroll-btn" id="news-prev" aria-label="Zurück">&#8592;</button>
                            <button class="news-scroll-btn" id="news-next" aria-label="Weiter">&#8594;</button>
                        </div>
                    </div>

                    <div class="news-cards-wrap">
                        <div class="news-cards"></div>
                    </div>
                </section>
                <!--- End News Section --->

                <section class="united-by-cats-picture">
                    <div class="united-by-cats">
                        <img
                            src="/assets/images/United_By_Cats_Picture.png"
                            alt="United-By-Cats-Picture"
                            class="united-by-cats-img"
                        />
                    </div>
                </section>
            </div>
            <!--- End Homepage --->

            <!--- Start Footer --->
            <div class="footer"></div>
            <!--- End Footer --->
        </div>
        <!--- End Grid Container --->

        <script src="/js/header.js"></script>
        <script src="/js/cookie.js"></script>
        <script src="/js/auth.js"></script>
        <script src="/js/news-cards.js"></script>
        <script src="/js/footer.js"></script>
    </body>
</html>
