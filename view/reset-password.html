<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Passwort zurücksetzen - DHBW ESC</title>
    <link rel="stylesheet" href="/assets/css/grid.css" />
    <link rel="stylesheet" href="/assets/css/dhbw-escc.css" />
    <link rel="stylesheet" href="/assets/css/backgroundd.css" />
    <link rel="stylesheet" href="/assets/css/login.css" />
    <link rel="stylesheet" href="/assets/css/signup.css" />
    <link rel="stylesheet" href="/assets/css/cookie.css" />
</head>
<body>
<div class="grid-container">
    <div class="header"></div>

    <div class="homepage login-page-wrapper">
        <div class="login-box">
            <h2>Neues Passwort vergeben</h2>

            <form id="resetPasswordForm">
                <div class="input-group">
                    <label for="password">Neues Passwort</label>
                    <input type="password" id="password" required placeholder="Beachte die Regeln">
                </div>
                <div class="input-group">
                    <label for="confirmPassword">Passwort bestätigen</label>
                    <input type="password" id="confirmPassword" required placeholder="Identisch zu Passwort">
                </div>

                <div class="password-hints">
                    <p>Das Passwort muss:</p>
                    <ul>
                        <li>mindestens 8 Zeichen lang sein</li>
                        <li>mindestens einen Großbuchstaben enthalten</li>
                        <li>mindestens ein Sonderzeichen wie !@#$%^&*()- enthalten</li>
                    </ul>
                </div>

                <p id="reset-error-message" class="error-msg hidden"></p>
                <p id="reset-info-message" class="info-msg hidden"></p>

                <button type="submit" class="submit-btn">Passwort speichern</button>
            </form>
        </div>
    </div>

    <div class="footer"></div>
</div>

<script src="/js/header.js"></script>
<script src="/js/cookie.js"></script>
<script src="/js/footer.js"></script>
<script src="/js/reset-password.js"></script>
</body>
</html>
